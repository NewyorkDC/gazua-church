# Render.com 블루프린트 — 웹소켓을 그대로 지원합니다.
# 리포를 연결하고 "New + → Blueprint" 로 이 파일을 고르면 끝입니다.
services:
  - type: web
    name: gazua-church
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ROOM_COUNT
        value: "1"
      - key: ROOM_CAP
        value: "100"
      - key: ROTATE_MS
        value: "300000"
